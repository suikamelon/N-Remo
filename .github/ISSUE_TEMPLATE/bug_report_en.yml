name: Bug report (English)
description: Report a problem with N-Remo
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include Tokens, Secrets, Webhook URLs, passwords, or personal information."
  - type: input
    id: version
    attributes:
      label: N-Remo version
      placeholder: "Example: 1.1.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
